[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genemeds-backend"
version = "0.1.0"
description = "GeneRX pharmacogenomics clinical decision support API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]
etl = [
    "httpx>=0.28,<1.0",
]

[project.scripts]
genemeds-etl = "etl.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
